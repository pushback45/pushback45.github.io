<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Under Maintenance | Clarence</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080b10;
        color: #ffffff;
        font-family: Arial, sans-serif;
        padding: 24px;
      }

      .maintenance {
        max-width: 650px;
        text-align: center;
      }

      .label {
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #8ca8ff;
        margin-bottom: 24px;
      }

      h1 {
        font-size: clamp(42px, 8vw, 72px);
        line-height: 1;
        margin-bottom: 24px;
      }

      p {
        color: #a9b0bc;
        font-size: 18px;
        line-height: 1.7;
        max-width: 520px;
        margin: 0 auto;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 32px;
        padding: 10px 16px;
        border: 1px solid #252a34;
        border-radius: 999px;
        color: #c8ced8;
        font-size: 14px;
      }

      .dot {
        width: 8px;
        height: 8px;
        background: #8ca8ff;
        border-radius: 50%;
      }
    </style>
  </head>

  <body>
    <main class="maintenance">
      <div class="label">Clarence — AI Automation Specialist</div>

      <h1>Something better is being built.</h1>

      <p>
        My portfolio is currently undergoing some improvements. I'll be back
        online soon with a better experience.
      </p>

      <div class="status">
        <span class="dot"></span>
        Currently under maintenance
      </div>
    </main>
  </body>
</html>
